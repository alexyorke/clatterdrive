name: Backend E2E

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  source-webdav:
    name: WebDAV source E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.8"
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Bootstrap Python tooling
        run: scripts/bootstrap.ps1 -PythonOnly

      - name: WebDAV, tee WAV, event trace, and shutdown smoke
        run: uv run python -m tools.backend_e2e --space-paths
